[alembic]
# path to migration scripts
script_location = alembic

# database URL (overridden by env at runtime if needed)
sqlalchemy.url = driver://user:pass@localhost/dbname

# version location
version_locations = alembic/versions

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for local timezone
timezone =

# max length of characters to apply to the
# "version" field of a version file
# (unused with the default naming scheme)
version_length = 4

# %(version)s will be replaced with the new version number
# %(dir)s will be replaced with the version directory
# %(message)s will be replaced with the user-supplied message
file_template = %%(version)s_%%(message)s

# dotenv
dotenv =

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated version scripts.
# See https://alembic.sqlalchemy.org/en/latest/tutorial.html#post-write-hooks
# for more details

hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
handlers =

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S